<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SCAR — The Last Choice</title>
  <meta name="description" content="A narrative choice-driven action game. Everyone has a superpower. You have zero. Until now." />

  <!-- Google Fonts: Orbitron, Rajdhani, Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100%; height: 100%;
      background: #020206;
      overflow: hidden;
      font-family: 'Rajdhani', 'Share Tech Mono', monospace;
      color: #e6f0ff;
    }

    #scar-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* ─── Start Screen (Cyberpunk Hero Aesthetic) ─── */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #0d0e1e 0%, #020206 75%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    #start-screen.hidden { display: none; }

    .scar-logo-box {
      position: relative;
      text-align: center;
      margin-bottom: 8px;
    }

    .scar-logo {
      font-family: 'Orbitron', monospace;
      font-size: clamp(56px, 11vw, 110px);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(255, 0, 51, 0.75), 0 0 50px rgba(0, 243, 255, 0.35);
    }

    .scar-tagline {
      font-family: 'Orbitron', monospace;
      font-size: clamp(13px, 2.2vw, 20px);
      font-weight: 700;
      color: #00f3ff;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .scar-hook {
      font-size: clamp(14px, 2vw, 18px);
      color: #a0aec0;
      margin-top: 24px;
      font-style: italic;
      text-align: center;
      max-width: 520px;
      line-height: 1.8;
    }

    .scar-divider {
      width: 140px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff0033, transparent);
      margin: 28px 0;
      box-shadow: 0 0 12px #ff0033;
    }

    .name-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    #player-name {
      background: rgba(14, 16, 28, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #ffffff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 17px;
      padding: 12px 20px;
      width: 240px;
      outline: none;
      border-radius: 6px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    #player-name:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    #btn-start {
      background: linear-gradient(135deg, #ff0033 0%, #aa0022 100%);
      color: #ffffff;
      border: none;
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 32px;
      cursor: pointer;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
      transition: all 0.2s ease;
    }

    #btn-start:hover {
      background: linear-gradient(135deg, #ff2255 0%, #cc0033 100%);
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.85);
      transform: translateY(-2px);
    }

    .scar-note {
      font-size: 12px;
      color: #4a5568;
      margin-top: 24px;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      line-height: 1.6;
    }

    /* ─── Leaderboard Overlay ─── */
    #leaderboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 10, 0.95);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 50px 20px;
      z-index: 200;
      overflow-y: auto;
    }

    #leaderboard-overlay.visible { display: flex; }

    #leaderboard-overlay h2 {
      font-family: 'Orbitron', monospace;
      color: #00f3ff;
      font-size: 32px;
      letter-spacing: 0.2em;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
      margin-bottom: 8px;
    }

    #leaderboard-overlay p {
      color: #718096;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      margin-bottom: 32px;
    }

    #leaderboard-list {
      width: 100%;
      max-width: 620px;
      background: rgba(10, 12, 22, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 8px;
      overflow: hidden;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
    }

    .lb-row:first-child { background: rgba(0, 243, 255, 0.06); }
    .lb-rank { color: #ffb700; width: 40px; font-weight: bold; }
    .lb-name { flex: 1; padding: 0 16px; color: #ffffff; }
    .lb-ending { font-size: 12px; color: #a0aec0; }
    .lb-score { color: #00ff88; font-weight: bold; font-size: 17px; }

    .lb-empty {
      color: #718096;
      text-align: center;
      padding: 50px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
    }

    #btn-close-lb {
      margin-top: 32px;
      background: transparent;
      border: 1px solid #4a5568;
      color: #a0aec0;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      padding: 10px 32px;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 0.15em;
      transition: all 0.2s ease;
    }

    #btn-close-lb:hover {
      border-color: #ff0033;
      color: #ff0033;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
    }
  </style>
</head>
<body>

  <!-- Master Game Canvas (Full-screen WebGL / 2D Canvas) -->
  <canvas id="scar-canvas"></canvas>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="scar-logo-box">
      <div class="scar-logo">SCAR</div>
      <div class="scar-tagline">The Last Choice</div>
    </div>
    <p class="scar-hook">
      "Everyone has a superpower.<br/>
      The player has ZERO."
    </p>
    <div class="scar-divider"></div>
    <div class="name-row">
      <input
        id="player-name"
        type="text"
        placeholder="ENTER CODENAME"
        maxlength="24"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="btn-start">ENTER CITY</button>
    </div>
    <p class="scar-note">
      CINEMATIC THIRD-PERSON ACTION EXPERIENCE<br/>
      REAL CHOICES • DYNAMIC POWERS • MULTIPLE ENDINGS
    </p>
  </div>

  <!-- Real Leaderboard Overlay -->
  <div id="leaderboard-overlay">
    <h2>CLASSIFIED LEADERBOARD</h2>
    <p>Authentic records verified by cloud telemetry</p>
    <div id="leaderboard-list">
      <div class="lb-empty">No players yet.</div>
    </div>
    <button id="btn-close-lb">RETURN TO CITY</button>
  </div>

  <!-- Game Script -->
  <script type="module" src="src/game.js"></script>

  <!-- Leaderboard toggle -->
  <script type="module">
    import { eventBus } from './src/core/EventBus.js';

    const overlay = document.getElementById('leaderboard-overlay');
    const closeBtn = document.getElementById('btn-close-lb');

    eventBus.on('SHOW_LEADERBOARD', async () => {
      overlay.classList.add('visible');
      const list = document.getElementById('leaderboard-list');

      // Fetch real data from backend if available, otherwise display clean empty status
      list.innerHTML = '<div class="lb-empty">No players yet.</div>';
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('visible');
    });
  </script>

</body>
</html>
