<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCAR — The Last Choice</title>
  <meta name="description" content="A narrative choice-driven game. Everyone has a superpower. You have zero. Until now." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    #scar-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ─── Start Screen ─── */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #start-screen.hidden { display: none; }

    .scar-logo {
      font-size: clamp(52px, 10vw, 96px);
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .scar-tagline {
      font-size: clamp(14px, 2.2vw, 20px);
      color: #555;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .scar-hook {
      font-size: clamp(13px, 1.8vw, 17px);
      color: #888;
      margin-top: 28px;
      font-style: italic;
      text-align: center;
      max-width: 480px;
      line-height: 1.7;
    }

    .scar-divider {
      width: 120px;
      height: 2px;
      background: #cc0000;
      margin: 32px 0;
    }

    .name-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #player-name {
      background: #111;
      border: 1px solid #333;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 10px 16px;
      width: 220px;
      outline: none;
      border-radius: 4px;
    }

    #player-name:focus {
      border-color: #cc0000;
    }

    #btn-start {
      background: #cc0000;
      color: #fff;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 28px;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      transition: background 0.15s;
    }

    #btn-start:hover { background: #ff2222; }

    .scar-note {
      font-size: 12px;
      color: #333;
      margin-top: 20px;
      text-align: center;
    }

    /* ─── Leaderboard overlay (Priyanshu fills this) ─── */
    #leaderboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      z-index: 200;
      overflow-y: auto;
    }

    #leaderboard-overlay.visible { display: flex; }

    #leaderboard-overlay h2 {
      color: #fff;
      font-size: 28px;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
    }

    #leaderboard-overlay p {
      color: #555;
      font-size: 14px;
      margin-bottom: 32px;
    }

    #leaderboard-list {
      width: 100%;
      max-width: 560px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #1a1a1a;
      color: #ccc;
      font-size: 15px;
    }

    .lb-row:first-child { border-top: 1px solid #1a1a1a; }
    .lb-rank { color: #555; width: 32px; }
    .lb-name { flex: 1; padding: 0 12px; }
    .lb-ending { font-size: 12px; color: #666; }
    .lb-score { color: #fff; font-weight: bold; }

    .lb-empty {
      color: #333;
      text-align: center;
      padding: 40px;
      font-size: 15px;
    }

    #btn-close-lb {
      margin-top: 32px;
      background: transparent;
      border: 1px solid #333;
      color: #666;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 8px 24px;
      cursor: pointer;
      border-radius: 4px;
    }

    #btn-close-lb:hover { border-color: #cc0000; color: #cc0000; }
  </style>
</head>
<body>

  <!-- Game Canvas — Kaustub and Ashwidha render here -->
  <canvas id="scar-canvas"></canvas>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="scar-logo">SCAR</div>
    <div class="scar-tagline">The Last Choice</div>
    <p class="scar-hook">
      Everyone has a superpower.<br/>
      You have zero.<br/>
      Until tonight changes everything.
    </p>
    <div class="scar-divider"></div>
    <div class="name-row">
      <input
        id="player-name"
        type="text"
        placeholder="Enter your name"
        maxlength="24"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="btn-start">Begin</button>
    </div>
    <p class="scar-note">
      Your choices define your power. Your power defines your ending.<br/>
      No fake scores. No fake players. Real choices only.
    </p>
  </div>

  <!-- Leaderboard Overlay — Priyanshu populates this -->
  <div id="leaderboard-overlay">
    <h2>LEADERBOARD</h2>
    <p>Real scores from real players</p>
    <div id="leaderboard-list">
      <div class="lb-empty">No players yet.</div>
    </div>
    <button id="btn-close-lb">Close</button>
  </div>

  <!-- Game Script -->
  <script type="module" src="src/game.js"></script>

  <!-- Leaderboard toggle -->
  <script type="module">
    import { eventBus } from './src/core/EventBus.js';

    const overlay = document.getElementById('leaderboard-overlay');
    const closeBtn = document.getElementById('btn-close-lb');

    eventBus.on('SHOW_LEADERBOARD', async () => {
      overlay.classList.add('visible');
      const list = document.getElementById('leaderboard-list');

      // Priyanshu: replace this with your real leaderboard fetch
      list.innerHTML = '<div class="lb-empty">No players yet.</div>';
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('visible');
    });
  </script>

</body>
</html>
